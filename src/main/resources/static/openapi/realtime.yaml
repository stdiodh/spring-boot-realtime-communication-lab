openapi: 3.1.0
info:
  title: Realtime WebSocket/STOMP Contract
  version: 1.0.0
  description: |-
    Sequence 08에서 사용하는 WebSocket/STOMP 경로를 읽기 전용으로 설명합니다.
    이 문서의 operation은 HTTP API가 아니며 실제 연결과 메시지 실험은 Live Lab에서 수행합니다.
servers:
  - url: http://localhost:8080
paths:
  /ws-chat:
    get:
      tags:
        - Connection
      summary: Native WebSocket 연결 endpoint
      description: HTTP 조회 API가 아니라 STOMP 연결을 시작하는 WebSocket upgrade endpoint입니다.
      operationId: connectWebSocket
      x-stomp-command: CONNECT
      responses:
        "101":
          description: WebSocket 연결로 전환됩니다.
  /app/chat.send:
    post:
      tags:
        - Messaging
      summary: Application destination으로 메시지 전송
      description: HTTP POST가 아니라 STOMP SEND frame이 MessageMapping handler로 들어가는 destination입니다.
      operationId: sendChatMessage
      x-stomp-command: SEND
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessage"
            example:
              sender: Client A
              content: hello
      responses:
        "200":
          description: 문서 표시용 응답입니다. 실제 STOMP SEND에는 HTTP 200 응답이 없으며 handler가 메시지를 topic broadcast 흐름으로 전달합니다.
  /topic/chat:
    get:
      tags:
        - Messaging
      summary: Topic 구독과 broadcast 수신
      description: HTTP 조회 API가 아니라 STOMP SUBSCRIBE와 MESSAGE frame에 사용하는 topic destination입니다.
      operationId: subscribeChatTopic
      x-stomp-command: SUBSCRIBE
      responses:
        "200":
          description: 문서 표시용 응답입니다. 실제 STOMP SUBSCRIBE에는 HTTP 200 응답이 없으며 구독자는 ChatMessage payload를 MESSAGE frame으로 수신합니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
components:
  schemas:
    ChatMessage:
      type: object
      required:
        - sender
        - content
      properties:
        sender:
          type: string
          description: 메시지를 보낸 client 이름
          example: Client A
        content:
          type: string
          description: broadcast할 메시지 본문
          example: hello
